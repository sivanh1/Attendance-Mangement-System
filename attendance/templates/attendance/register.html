<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — AMS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4ff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
      width: 100%; max-width: 400px; overflow: hidden;
      box-shadow: 0 4px 24px rgba(37,99,235,.08);
    }
    .auth-top { background: #2563eb; padding: 28px 32px 24px; }
    .auth-logo { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -.02em; }
    .auth-tagline { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 3px; }
    .auth-body { padding: 28px 32px 32px; }
    .auth-heading { font-size: 17px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .auth-sub { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em; color: #94a3b8; margin-bottom: 5px;
    }
    .field input {
      width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; color: #0f172a; background: #fff; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .submit-btn {
      width: 100%; padding: 11px; background: #2563eb; color: #fff; border: none;
      border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background .15s; margin-top: 4px; font-family: inherit;
    }
    .submit-btn:hover { background: #1d4ed8; }
    .auth-footer { margin-top: 18px; font-size: 13px; color: #94a3b8; text-align: center; }
    .auth-footer a { color: #2563eb; font-weight: 600; }
    .messages { list-style: none; margin-bottom: 16px; }
    .messages li { padding: 9px 12px; border-radius: 7px; font-size: 13px; margin-bottom: 6px; }
    .messages .error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .messages .success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-top">
      <div class="auth-logo">AMS</div>
      <div class="auth-tagline">Attendance Management System</div>
    </div>
    <div class="auth-body">
      <div class="auth-heading">Create account</div>
      <div class="auth-sub">Set up your employee account to get started</div>
      {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
      </ul>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" autofocus required placeholder="Choose a username">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required placeholder="Create a password">
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input type="password" name="password2" required placeholder="Repeat password">
        </div>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>
      <div class="auth-footer">Already have an account? <a href="{% url 'login' %}">Sign in</a></div>
    </div>
  </div>
</body>
</html>
