{% extends 'attendance/base.html' %}
{% block title %}System Settings{% endblock %}
{% block topbar_title %}System Settings{% endblock %}
{% block content %}

<div style="max-width: 480px;">

  <div class="ss-card">
    <div class="ss-card-head">Current System Date</div>
    <div class="ss-current-date">{{ system_date|date:"l, d F Y" }}</div>
  </div>

  <div class="ss-card" style="margin-top:14px;">
    <div class="ss-card-head">Update System Date</div>
    <form method="post">
      {% csrf_token %}
      <div class="ss-field">
        <label>Set Date</label>
        <input type="date" name="current_date" value="{{ system_date }}" required>
      </div>
      <button type="submit" class="ss-btn ss-btn-primary">Update Date</button>
    </form>
    <div class="ss-divider"></div>
    <form method="post">
      {% csrf_token %}
      <button type="submit" name="reset_today" value="1" class="ss-btn ss-btn-outline">Reset to Today's Date</button>
    </form>
  </div>

</div>

<style>
.ss-card {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px;
}
.ss-card-head {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .09em; color: #94a3b8; margin-bottom: 12px;
}
.ss-current-date {
  font-size: 20px; font-weight: 700; color: #0f172a; letter-spacing: -.02em;
}
.ss-field { margin-bottom: 16px; }
.ss-field label {
  display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; color: #94a3b8; margin-bottom: 5px;
}
.ss-field input {
  width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px;
  font-size: 14px; color: #0f172a; font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.ss-field input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
.ss-btn {
  width: 100%; padding: 10px; border-radius: 9px; font-size: 13.5px; font-weight: 700;
  cursor: pointer; font-family: inherit; border: 1.5px solid transparent; transition: all .15s;
}
.ss-btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
.ss-btn-primary:hover { background: #1d4ed8; }
.ss-btn-outline { background: #fff; color: #64748b; border-color: #e2e8f0; }
.ss-btn-outline:hover { border-color: #2563eb; color: #2563eb; }
.ss-divider { border: none; border-top: 1px solid #f1f5f9; margin: 14px 0; }
</style>

{% endblock %}
